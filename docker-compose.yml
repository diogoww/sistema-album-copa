services:
  db:
    image: postgres:16
    container_name: album_copa_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: album_copa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  app:
    build: .
    container_name: album_copa_app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/album_copa
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      AUTH_SECRET: change-me-in-production
      AUTH_TRUST_HOST: "true"
      RATE_LIMIT_WINDOW_MS: "60000"
      RATE_LIMIT_MAX: "60"
    ports:
      - "3000:3000"
    depends_on:
      - db
volumes:
  postgres_data:
